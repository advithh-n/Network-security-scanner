{% extends "layout.html" %}
{% block content %}
<section class="panel auth-panel">
  <h2>Change password</h2>
  <form method="post" action="{{ url_for('change_password') }}" class="grid-form">
    <label>
      Current password
      <input type="password" name="current_password" required />
    </label>
    <label>
      New password
      <input type="password" name="new_password" required />
    </label>
    <label>
      Confirm new password
      <input type="password" name="confirm_password" required />
    </label>
    <div class="form-actions">
      <button type="submit" class="button">Update password</button>
      {% if message %}<p class="hint" style="color: var(--success);">{{ message }}</p>{% endif %}
      {% if error %}<p class="hint" style="color: var(--danger);">{{ error }}</p>{% endif %}
    </div>
  </form>
</section>
{% endblock %}
